server {
    # Unprivileged port — lets the container run as a non-root user with all
    # Linux capabilities dropped.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the exact nginx version in responses.
    server_tokens off;

    # -------------------------------------------------------------------------
    # Security headers
    #
    # The app previously shipped none of these. The CSP is deliberately strict:
    # no inline scripts, no external script/frame sources. 'unsafe-inline' is
    # allowed for styles only because MUI injects styles at runtime via emotion.
    # -------------------------------------------------------------------------
    add_header X-Content-Type-Options    "nosniff"              always;
    add_header X-Frame-Options           "DENY"                 always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Health endpoint for Kubernetes probes — never cached, never logged.
    location = /healthz {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok"}';
    }

    # React Router: serve index.html for any unmatched path.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy to the gateway.
    location /api/ {
        proxy_pass http://gateway:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Strip any client-supplied identity headers before they reach the
        # gateway. Defence in depth — the gateway strips them too.
        proxy_set_header X-User-Id        "";
        proxy_set_header X-User-Email     "";
        proxy_set_header X-User-Role      "";
        proxy_set_header X-Authenticated  "";

        proxy_connect_timeout 5s;
        proxy_read_timeout   30s;
    }

    # Hashed build assets are safe to cache aggressively.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or users get a stale bundle after deploy.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires 0;
    }
}
