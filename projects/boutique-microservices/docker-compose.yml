# =============================================================================
# Boutique Microservices — local development stack
# =============================================================================
# Requires a .env file in this directory. Copy .env.example and fill it in:
#   cp .env.example .env
#
# The ${VAR:?message} syntax makes Compose ABORT if a variable is missing,
# so a misconfigured stack fails loudly instead of silently falling back to
# a well-known default password.
# =============================================================================

x-common-security: &common-security
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

x-node-service: &node-service
  <<: *common-security
  environment: &node-env
    NODE_ENV: ${NODE_ENV:-development}
    JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
    JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
    JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
    JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
    JWT_ISSUER: ${JWT_ISSUER:-boutique-auth}
    JWT_AUDIENCE: ${JWT_AUDIENCE:-boutique-api}
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: boutique-postgres
    <<: *common-security
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    # Bound to loopback only. Previously "5432:5432" exposed the database on
    # every host interface, including the LAN.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - boutique-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Observability
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: boutique-prometheus
    <<: *common-security
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - boutique-network

  grafana:
    image: grafana/grafana:11.1.0
    container_name: boutique-grafana
    <<: *common-security
    ports:
      - "127.0.0.1:3007:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER is required}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - boutique-network
    depends_on:
      - prometheus

  # ---------------------------------------------------------------------------
  # API Gateway — the only service published to the host besides the frontend
  # ---------------------------------------------------------------------------
  gateway:
    build:
      context: ./backend/services/gateway
      dockerfile: Dockerfile
    container_name: boutique-gateway
    <<: *node-service
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      <<: *node-env
      PORT: "3001"
      GATEWAY_PORT: "3001"
      AUTH_SERVICE_URL: http://auth:3002
      PRODUCTS_SERVICE_URL: http://product-service:3003
      ORDER_SERVICE_URL: http://order-service:3004
      ORDERS_SERVICE_URL: http://orders:3005
      USERS_SERVICE_URL: http://user-service:3006
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-5}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - boutique-network

  # ---------------------------------------------------------------------------
  # Backend services — no host ports. Reachable only through the gateway.
  # ---------------------------------------------------------------------------
  auth:
    build:
      context: ./backend/services/auth
      dockerfile: Dockerfile
    container_name: boutique-auth
    <<: *node-service
    expose:
      - "3002"
    environment:
      <<: *node-env
      PORT: "3002"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/auth_db
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-5}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - boutique-network

  product-service:
    build:
      context: ./backend/services/product-service
      dockerfile: Dockerfile
    container_name: boutique-products
    <<: *node-service
    expose:
      - "3003"
    environment:
      <<: *node-env
      PORT: "3003"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/products_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - boutique-network

  order-service:
    build:
      context: ./backend/services/order-service
      dockerfile: Dockerfile
    container_name: boutique-order-service
    <<: *node-service
    expose:
      - "3004"
    environment:
      <<: *node-env
      PORT: "3004"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/orders_db
      AUTH_SERVICE_URL: http://auth:3002
      PRODUCT_SERVICE_URL: http://product-service:3003
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_started
      product-service:
        condition: service_started
    networks:
      - boutique-network

  orders:
    build:
      context: ./backend/services/orders
      dockerfile: Dockerfile
    container_name: boutique-order-management
    <<: *node-service
    expose:
      - "3005"
    environment:
      <<: *node-env
      PORT: "3005"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/orders_db
      PRODUCTS_SERVICE_URL: http://product-service:3003
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - boutique-network

  user-service:
    build:
      context: ./backend/services/user-service
      dockerfile: Dockerfile
    container_name: boutique-users
    <<: *node-service
    expose:
      - "3006"
    environment:
      <<: *node-env
      PORT: "3006"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/users_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - boutique-network

  # ---------------------------------------------------------------------------
  # Frontend
  # ---------------------------------------------------------------------------
  frontend:
    image: nginx:1.27-alpine
    container_name: boutique-frontend
    <<: *common-security
    volumes:
      - ./frontend/build:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # nginx.conf now listens on 8080 so the container can run unprivileged.
    ports:
      - "127.0.0.1:3000:8080"
    depends_on:
      - gateway
    networks:
      - boutique-network

volumes:
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  boutique-network:
    driver: bridge
