name: Boutique CI Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/boutique-microservices/**'
      - '.github/workflows/ci.yml'

# Least privilege by default; individual jobs opt in to what they need.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ---------------------------------------------------------------------------
  # Static analysis — runs before anything is built or pushed
  # ---------------------------------------------------------------------------
  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Catches credentials committed to the repo. This is exactly the class of
      # bug that put a live Postgres password in gitops/secrets.yml.
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Terraform misconfiguration scanning: public API endpoints, unencrypted
      # volumes, permissive security groups.
      - name: Scan IaC with Trivy
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: projects/Infrastructure
          format: sarif
          output: trivy-iac.sarif
          severity: HIGH,CRITICAL
          exit-code: '0' # report, do not block, until the backlog is clear

      - name: Upload IaC findings
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-iac.sarif') != ''
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-iac

  # ---------------------------------------------------------------------------
  # Dependency audit + type check per service
  # ---------------------------------------------------------------------------
  verify:
    name: Verify ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth
          - gateway
          - orders
          - order-service
          - product-service
          - user-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        working-directory: projects/boutique-microservices/backend/services/${{ matrix.service }}
        run: npm install

      - name: Audit dependencies
        working-directory: projects/boutique-microservices/backend/services/${{ matrix.service }}
        # Report known-vulnerable packages. Not blocking yet — flip to
        # `npm audit --audit-level=high` once the existing findings are cleared.
        run: npm audit --audit-level=high || true

      - name: Type check
        working-directory: projects/boutique-microservices/backend/services/${{ matrix.service }}
        run: npx tsc --noEmit || true

  # ---------------------------------------------------------------------------
  # Build and push
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [security-scan, verify]

    # Required for GitHub OIDC. This replaces long-lived AWS_ACCESS_KEY_ID /
    # AWS_SECRET_ACCESS_KEY repository secrets, which never expire, are
    # invisible once set, and grant standing access to the AWS account to
    # anyone who can run a workflow.
    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - auth
          - gateway
          - orders
          - order-service
          - product-service
          - user-service
          - frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Assumes a role via short-lived OIDC credentials (valid ~1 hour).
      #
      # SETUP: create the role once, trusting GitHub's OIDC provider and
      # restricting it to this repository:
      #
      #   "Condition": {
      #     "StringEquals": {
      #       "token.actions.githubusercontent.com:aud": "sts.amazonaws.com"
      #     },
      #     "StringLike": {
      #       "token.actions.githubusercontent.com:sub":
      #         "repo:JimilPrabtani/DevOps-project-02:*"
      #     }
      #   }
      #
      # Then set the repository variable AWS_ROLE_ARN and DELETE the
      # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY secrets.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: boutique-ci-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve build path
        id: path
        run: |
          if [ "${{ matrix.service }}" = "frontend" ]; then
            echo "dir=projects/boutique-microservices/frontend" >> "$GITHUB_OUTPUT"
          else
            echo "dir=projects/boutique-microservices/backend/services/${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build \
            -t "$REGISTRY/${{ matrix.service }}:$IMAGE_TAG" \
            "${{ steps.path.outputs.dir }}"

      # Scan the built image BEFORE it reaches the registry. ECR's scan-on-push
      # only reports after the vulnerable image is already stored and pullable.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/${{ matrix.service }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0' # switch to '1' to block releases on new CVEs

      - name: Push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: docker push "$REGISTRY/${{ matrix.service }}:$IMAGE_TAG"

  # ---------------------------------------------------------------------------
  # Update GitOps manifests
  # ---------------------------------------------------------------------------
  update-manifests:
    name: Update manifests
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Use the default GITHUB_TOKEN with a job-scoped write permission
          # rather than a long-lived personal access token.
          persist-credentials: true

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: boutique-manifests-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve registry
        id: reg
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          echo "registry=${ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_OUTPUT"

      - name: Update image tags
        env:
          REGISTRY: ${{ steps.reg.outputs.registry }}
        run: |
          set -euo pipefail
          for SERVICE in auth gateway orders order-service product-service user-service; do
            MANIFEST="gitops/k8s/backend/${SERVICE}.yml"
            sed -i -E "s|image: .*/${SERVICE}:.*|image: ${REGISTRY}/${SERVICE}:${IMAGE_TAG}|g" "$MANIFEST"
          done
          sed -i -E "s|image: .*/frontend:.*|image: ${REGISTRY}/frontend:${IMAGE_TAG}|g" \
            gitops/k8s/frontend/deployment.yml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitops/k8s/
          git diff --staged --quiet || git commit -m "ci: update image tags to ${IMAGE_TAG}"
          git push
