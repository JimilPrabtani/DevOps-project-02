apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: boutique

# NOTE: secrets.yml is intentionally ABSENT from this list.
# The boutique-secrets Secret is created out-of-band from .env by
# ./scripts/bootstrap-secrets.sh so that no credential is ever committed.
# See gitops/secrets.example.yml for the Sealed Secrets / External Secrets
# migration path if you want ArgoCD to manage it natively.
resources:
  - namespace.yml
  - network-policies.yml
  - k8s/config.yml
  - k8s/database/statefulset.yml
  - k8s/database/service.yml
  - k8s/backend/gateway.yml
  - k8s/backend/service-monitor.yml
  - k8s/backend/auth.yml
  - k8s/backend/product-service.yml
  - k8s/backend/order-service.yml
  - k8s/backend/orders.yml
  - k8s/backend/user-service.yml
  - k8s/frontend/deployment.yml
  - k8s/grafana-dashboard.yml

configMapGenerator:
  - name: boutique-db-dump
    files:
      - k8s/database/boutique_full.sql

generatorOptions:
  disableNameSuffixHash: true
