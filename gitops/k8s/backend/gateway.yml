apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: boutique
  labels:
    app: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      containers:
        - name: gateway
          image: 123209654419.dkr.ecr.us-east-1.amazonaws.com/gateway:6070b4fdb4c98fe92df77f37683c82ab6c8a758f
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3001"
            - name: GATEWAY_PORT
              value: "3001"
            # The gateway verifies access tokens itself, so it needs the same
            # signing secret the auth service uses to issue them.
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: boutique-secrets
                  key: JWT_ACCESS_SECRET
          envFrom:
            - configMapRef:
                name: boutique-config
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: boutique
  labels:
    app: gateway
spec:
  selector:
    app: gateway
  ports:
    - name: http
      protocol: TCP
      port: 3001
      targetPort: http
  type: ClusterIP
