# Non-secret shared configuration.
#
# Anything in here is world-readable to anyone with `get configmap` in the
# namespace, so it must contain NO credentials. Secrets live in the
# boutique-secrets Secret, created by ./scripts/bootstrap-secrets.sh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: boutique-config
  namespace: boutique
data:
  # Service discovery
  AUTH_SERVICE_URL: "http://auth:3002"
  PRODUCTS_SERVICE_URL: "http://product-service:3003"
  ORDER_SERVICE_URL: "http://order-service:3004"
  ORDERS_SERVICE_URL: "http://orders:3005"
  USERS_SERVICE_URL: "http://user-service:3006"

  # JWT claims — must match across every service that verifies a token.
  JWT_ISSUER: "boutique-auth"
  JWT_AUDIENCE: "boutique-api"
  JWT_ACCESS_TTL: "15m"
  JWT_REFRESH_TTL: "7d"

  # CORS allowlist. Replace with your real origin before exposing publicly;
  # this must never be "*" now that the API uses credentialed requests.
  CORS_ALLOWED_ORIGINS: "http://localhost:3000"

  # Cookies are only marked Secure when the site is actually served over TLS.
  # Set to "true" once you terminate HTTPS at an ingress/load balancer.
  COOKIE_SECURE: "false"
  COOKIE_SAMESITE: "lax"

  BCRYPT_ROUNDS: "12"
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX_REQUESTS: "100"
  AUTH_RATE_LIMIT_MAX: "5"
