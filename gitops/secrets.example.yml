# =============================================================================
# TEMPLATE ONLY — this file is safe to commit because it contains no real values.
# =============================================================================
#
# The previous `gitops/secrets.yml` contained a live database password in
# plaintext and was tracked in Git. It has been removed.
#
# DO NOT recreate secrets.yml with real values. Instead, create the Secret
# out-of-band from your .env file:
#
#   ./scripts/bootstrap-secrets.sh
#
# ...or adopt one of these GitOps-native options so ArgoCD can still manage it:
#
#   1. Sealed Secrets (bitnami-labs/sealed-secrets)
#      kubeseal --format yaml < secret.yml > sealed-secret.yml
#      The sealed output IS safe to commit — only the in-cluster controller
#      holds the private key needed to decrypt it.
#
#   2. External Secrets Operator + AWS Secrets Manager / SSM Parameter Store
#      Commit only a reference (an ExternalSecret CR); the operator pulls the
#      real value at runtime using IRSA. This is the recommended path for
#      this project, since it already runs on EKS with an OIDC provider.
#
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: boutique-secrets
  namespace: boutique
type: Opaque
stringData:
  POSTGRES_DB: "<from .env POSTGRES_DB>"
  POSTGRES_USER: "<from .env POSTGRES_USER>"
  POSTGRES_PASSWORD: "<from .env POSTGRES_PASSWORD>"

  # Must be >= 32 chars and different from each other.
  JWT_ACCESS_SECRET: "<from .env JWT_ACCESS_SECRET>"
  JWT_REFRESH_SECRET: "<from .env JWT_REFRESH_SECRET>"

  AUTH_DB_URL: "postgresql://<user>:<password>@boutique-postgres:5432/auth_db"
  PRODUCTS_DB_URL: "postgresql://<user>:<password>@boutique-postgres:5432/products_db"
  ORDERS_DB_URL: "postgresql://<user>:<password>@boutique-postgres:5432/orders_db"
  USERS_DB_URL: "postgresql://<user>:<password>@boutique-postgres:5432/users_db"
